[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "writing-assistant-llm"
version = "0.1.0"
description = "Live KV-cache LLM backend for writing-assistant"
requires-python = ">=3.10"
dependencies = [
    "llama-cpp-python>=0.3.0",
]

[project.scripts]
was-llm = "llm.run:main"

[tool.setuptools]
packages = ["llm"]
